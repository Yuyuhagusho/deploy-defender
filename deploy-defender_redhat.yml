---
- hosts: all
  become: yes
  gather_facts: false

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.raw: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -y && \
        sudo DEBIAN_FRONTEND=noninteractive apt-get --fix-broken install -y && \
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl apt-transport-https gnupg python3
      changed_when: false

    - name: Add Microsoft GPG key
      ansible.builtin.raw: |
        sudo mkdir -p /etc/apt/keyrings
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg --yes
      changed_when: false

    - name: Add Microsoft Defender repository for Debian 11
      ansible.builtin.raw: |
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/11/prod bullseye main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list
      changed_when: false

    - name: Update apt cache and install mdatp
      ansible.builtin.raw: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -y && \
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mdatp
      changed_when: false

    - name: Transfer Onboarding Script
      ansible.builtin.raw: |
        cat << 'EOF' | sudo tee /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py > /dev/null
        {{ lookup('file', 'MicrosoftDefenderATPOnboardingLinuxServer.py') }}
        EOF
        sudo chmod +x /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Run Onboarding Script
      ansible.builtin.raw: sudo python3 /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Check mdatp status
      ansible.builtin.raw: mdatp health
      changed_when: false
