---
- hosts: all
  become: yes
  gather_facts: false

  tasks:
    - name: Ensure apt transport https and curl are installed
      ansible.builtin.raw: |
        apt-get update -y
        apt-get install -y curl apt-transport-https gnupg python3
      changed_when: false

    - name: Add Microsoft GPG key for Debian
      ansible.builtin.raw: |
        mkdir -p /etc/apt/keyrings
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg --yes
      changed_when: false

    - name: Add Microsoft Defender repository for Debian 11
      ansible.builtin.raw: |
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/11/prod bullseye main" > /etc/apt/sources.list.d/microsoft-prod.list
      changed_when: false

    - name: Update apt cache and install mdatp
      ansible.builtin.raw: |
        apt-get update -y
        apt-get install -y mdatp
      changed_when: false

    - name: Transfer Onboarding Script
      ansible.builtin.raw: |
        cat << 'EOF' > /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
        {{ lookup('file', 'MicrosoftDefenderATPOnboardingLinuxServer.py') }}
        EOF
        chmod +x /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Run Onboarding Script
      ansible.builtin.raw: python3 /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Check mdatp status
      ansible.builtin.raw: mdatp health
      changed_when: false
