---
- hosts: all
  become: yes
  gather_facts: false

  tasks:
    - name: Fix EOL repositories and enable vault repos
      ansible.builtin.raw: |
        if [ -d /etc/yum.repos.d ]; then
          sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/*.repo 2>/dev/null || true
          sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/*.repo 2>/dev/null || true
          sed -i 's|baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/*.repo 2>/dev/null || true
          sed -i 's/enabled=0/enabled=1/g' /etc/yum.repos.d/*.repo 2>/dev/null || true
        fi
      changed_when: false

    - name: Install required packages (curl, gnupg, python3)
      ansible.builtin.raw: |
        dnf install --disablerepo=* --enablerepo=appstream --enablerepo=baseos -y curl gnupg2 python3 || dnf install -y curl gnupg2 python3 || yum install -y curl gnupg2 python3
      changed_when: false

    - name: Add Microsoft GPG key
      ansible.builtin.raw: |
        rpm --import https://packages.microsoft.com/keys/microsoft.asc
      changed_when: false

    - name: Add Microsoft Defender repository for RHEL/CentOS
      ansible.builtin.raw: |
        curl -sSL -o /etc/yum.repos.d/microsoft-prod.repo https://packages.microsoft.com/config/rhel/8/prod.repo
      changed_when: false

    - name: Update package cache and install mdatp
      ansible.builtin.raw: |
        dnf makecache && dnf install -y mdatp || yum install -y mdatp
      changed_when: false

    - name: Transfer Onboarding Script
      ansible.builtin.raw: |
        cat << 'EOF' > /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
        {{ lookup('file', 'MicrosoftDefenderATPOnboardingLinuxServer.py') }}
        EOF
        chmod +x /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Run Onboarding Script
      ansible.builtin.raw: python3 /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Check mdatp status
      ansible.builtin.raw: mdatp health
      changed_when: false
