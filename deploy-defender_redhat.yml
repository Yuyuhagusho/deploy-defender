---
- hosts: all
  become: yes
  gather_facts: false

  tasks:
    - name: Clean up ALL existing repository files
      ansible.builtin.raw: |
        rm -rf /etc/yum.repos.d/*.repo
      changed_when: false

    - name: Set up clean CentOS 8 Vault repository
      ansible.builtin.raw: |
        cat << 'EOF' > /etc/yum.repos.d/centos-vault.repo
        [vault-baseos]
        name=CentOS Stream 8 - BaseOS Vault
        baseurl=http://vault.centos.org/centos/8-stream/BaseOS/x86_64/os/
        gpgcheck=0
        enabled=1

        [vault-appstream]
        name=CentOS Stream 8 - AppStream Vault
        baseurl=http://vault.centos.org/centos/8-stream/AppStream/x86_64/os/
        gpgcheck=0
        enabled=1
        EOF
      changed_when: false

    - name: Clean DNF cache thoroughly
      ansible.builtin.raw: |
        dnf clean all --enablerepo=*
        rm -rf /var/cache/dnf /var/cache/yum
      changed_when: false

    - name: Install required prerequisites (curl, gnupg, python3)
      ansible.builtin.raw: |
        dnf install -y --disablerepo=* --enablerepo=vault-baseos,vault-appstream curl gnupg2 python3
      changed_when: false

    - name: Add Microsoft GPG key
      ansible.builtin.raw: |
        rpm --import https://packages.microsoft.com/keys/microsoft.asc
      changed_when: false

    - name: Add Microsoft Defender repository
      ansible.builtin.raw: |
        curl -sSL -o /etc/yum.repos.d/microsoft-prod.repo https://packages.microsoft.com/config/rhel/8/prod.repo
      changed_when: false

    - name: Install Microsoft Defender (mdatp)
      ansible.builtin.raw: |
        dnf install -y --disablerepo=* --enablerepo=vault-baseos,vault-appstream,packages-microsoft-com-prod mdatp
      changed_when: false

    - name: Transfer Onboarding Script
      ansible.builtin.raw: |
        cat << 'EOF' > /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
        {{ lookup('file', 'MicrosoftDefenderATPOnboardingLinuxServer.py') }}
        EOF
        chmod +x /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Run Onboarding Script
      ansible.builtin.raw: python3 /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Check mdatp status
      ansible.builtin.raw: mdatp health
      changed_when: false
