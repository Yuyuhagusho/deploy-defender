---
- name: Deploy and Onboard Microsoft Defender on Linux
  hosts: all
  become: yes
  gather_facts: false
    
  tasks:
    - name: Fix CentOS Stream 8 EOL repositories to use Vault
      ansible.builtin.raw: |
        sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*
        sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*
      changed_when: false
      
    - name: Install prerequisite packages
      ansible.builtin.raw: dnf install -y curl ca-certificates
      changed_when: false
      
    - name: Add Microsoft GPG key
      ansible.builtin.raw: rpm --import https://packages.microsoft.com/keys/microsoft.asc
      changed_when: false
      
    - name: Add Microsoft Defender repository
      ansible.builtin.raw: |
        curl -o /etc/yum.repos.d/microsoft-prod.repo https://packages.microsoft.com/config/rhel/8/prod.repo
      changed_when: false
      
    - name: Install Microsoft Defender (mdatp)
      ansible.builtin.raw: dnf install -y mdatp
      changed_when: false
      
    - name: Copy Onboarding Script to Target Machine
      ansible.builtin.raw: |
        cat << 'EOF' > /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
        {{ lookup('file', 'MicrosoftDefenderATPOnboardingLinuxServer.py') }}
        EOF
        chmod +x /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Run Onboarding Script
      ansible.builtin.raw: python3 /tmp/MicrosoftDefenderATPOnboardingLinuxServer.py
      changed_when: false

    - name: Check mdatp status
      command: mdatp health
      register: mdatp_health
      changed_when: false

    - name: Display Defender Status
      debug:
        var: mdatp_health.stdout_lines
